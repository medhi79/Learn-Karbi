name: Build Talk Aurelia Learn Karbi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Prepare Android Project & Sync Assets
        run: |
          mkdir -p android/app/src/main/assets/www/data
          cp index.html android/app/src/main/assets/www/index.html
          cp -f *.json android/app/src/main/assets/www/data/ 2>/dev/null || true

          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TalkAureliaLearnKarbi"
          include ':app'
          EOF

          cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.7.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Talk-Aurelia-Learn-Karbi-v1.0.apk

      - name: Upload New App APK
        uses: actions/upload-artifact@v4
        with:
          name: Talk-Aurelia-Learn-Karbi-v1-APK
          path: Talk-Aurelia-Learn-Karbi-v1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talk Aurelia • Learn Karbi v1.0.${{ github.run_number }}
          files: Talk-Aurelia-Learn-Karbi-v1.0.apk
