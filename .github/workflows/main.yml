name: Build Talk Aurelia Learn Karbi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required App Files
        run: |
          ls -la
          ls -la android/app/
          test -f index.html || (echo "ERROR: index.html missing!" && exit 1)
          test -f android/app/build.gradle || (echo "ERROR: android/app/build.gradle missing!" && exit 1)
          test -f android/app/src/main/AndroidManifest.xml || (echo "ERROR: AndroidManifest.xml missing!" && exit 1)
          test -f android/app/src/main/java/com/talkaurelia/learnkarbi/MainActivity.kt || (echo "ERROR: MainActivity.kt missing!" && exit 1)

      - name: Sync Web Assets to Android WWW
        run: |
          mkdir -p android/app/src/main/assets/www/data
          cp index.html android/app/src/main/assets/www/index.html
          cp -f *.json android/app/src/main/assets/www/data/ 2>/dev/null || true

      - name: Create Root Gradle Project Files
        run: |
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TalkAureliaLearnKarbi"
          include ':app'
          EOF

          cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7 & Build Debug APK
        working-directory: ./android
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload New App APK
        uses: actions/upload-artifact@v4
        with:
          name: Talk-Aurelia-Learn-Karbi-v1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
