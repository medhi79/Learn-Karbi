name: Validate Karbi Assets & Build Talk Aurelia APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Talk Aurelia_Learn Karbi"
  APP_VERSION: "v2.0.0"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for KarbiVerifier
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Karbi JSON Assets (Report Warnings)
        continue-on-error: true
        run: python scripts/validate_karbi_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug and Release APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Sign Release APK & Rename Both APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/${APP_NAME}_${APP_VERSION}_debug.apk"

          keytool -genkeypair -v \
            -keystore talk_aurelia_release.jks \
            -alias talkaurelia \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "TalkAurelia2026" -keypass "TalkAurelia2026" \
            -dname "CN=Talk Aurelia, OU=Karbi Language, O=LearnKarbi, L=Dokmoka, ST=Assam, C=IN"

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks talk_aurelia_release.jks \
            --ks-key-alias talkaurelia \
            --ks-pass pass:TalkAurelia2026 \
            --key-pass pass:TalkAurelia2026 \
            --out "release_apks/${APP_NAME}_${APP_VERSION}_release-signed.apk" \
            app-release-aligned.apk

          ls -lh release_apks/

      - name: Upload Debug & Release-Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: Talk_Aurelia_Learn_Karbi_v2.0.0_APKs
          path: release_apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: "${{ env.APP_NAME }} ${{ env.APP_VERSION }} (Build #${{ github.run_number }})"
          body: "Automated native Kotlin + Jetpack Compose build containing both debug.apk and release-signed.apk for Talk Aurelia_Learn Karbi (Hills Karbi Standard, LiteRT-LM 0.18.0)."
          files: release_apks/*.apk
