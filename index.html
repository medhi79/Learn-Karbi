<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🧚‍♀️ Talk Aurelia • Learn Karbi Language</title>
  <style>
    :root {
      --teal-dark: #0f766e;
      --teal-main: #0d9488;
      --teal-light: #ccfbf1;
      --teal-bg: #f0fdfa;
      --gold: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Smart Auto-Hide Header */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 40;
      background: linear-gradient(135deg, var(--teal-dark), var(--teal-main));
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 2px 10px rgba(15, 118, 110, 0.25);
      transition: transform 0.25s ease;
    }
    header.header-hidden { transform: translateY(-100%); }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 11px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot-live {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
      display: inline-block;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .top-btn {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .top-btn.exit-btn {
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(254, 202, 202, 0.45);
    }

    /* Try Chips Bar */
    .try-bar {
      margin-top: 56px;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
      transition: margin-top 0.25s ease;
    }
    header.header-hidden + .try-bar { margin-top: 0; }
    .try-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--teal-dark);
      letter-spacing: 0.4px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:active { background: var(--teal-light); border-color: var(--teal-main); }

    /* Chat Area */
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 92%;
    }
    .msg-row.user { align-self: flex-end; }
    .msg-row.bot { align-self: flex-start; width: 94%; }

    .user-bubble {
      background: var(--teal-main);
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.18);
    }
    .user-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      opacity: 0.92;
    }
    .user-meta button, .user-meta span.ts-link {
      background: none;
      border: none;
      color: #fff;
      font-size: 11px;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }

    .bot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .badge-src {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--teal-dark);
      background: var(--teal-light);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .lang-block {
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 7px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }
    .lang-block.karbi {
      background: var(--teal-bg);
      border-color: #99f6e4;
    }
    .lang-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--teal-dark);
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }
    .lang-block:not(.karbi) .lang-tag { color: var(--muted); }
    .lang-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .grammar-note {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 2px 10px;
      line-height: 1.4;
    }
    .card-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .speak-btn {
      background: var(--teal-bg);
      border: 1px solid #99f6e4;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .ts-pill {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
    }
    .action-link {
      background: none;
      border: none;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 6px;
      cursor: pointer;
    }
    .action-link.copy { color: var(--muted); }

    /* Inline Edit Form */
    .inline-edit-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
    .inline-edit-box input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      font-size: 13px;
    }
    .inline-edit-actions {
      display: flex;
      gap: 8px;
    }
    .btn-save-sm {
      background: var(--teal-main);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-cancel-sm {
      background: #e2e8f0;
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Input Bar */
    .input-bar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .mic-btn {
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 1.5px solid #fda4af;
      background: #fff1f2;
      color: #e11d48;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mic-btn.listening {
      background: #e11d48;
      color: #fff;
      animation: pulse 1.1s infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    #userInput {
      flex: 1;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }
    #userInput:focus { border-color: var(--teal-main); }
    .send-btn {
      width: 44px; height: 42px;
      border-radius: 12px;
      border: none;
      background: var(--teal-dark);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Modals — ALWAYS closed by default on startup */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.55);
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 540px;
      max-height: 88dvh;
      border-radius: 20px 20px 0 0;
      padding: 16px;
      overflow-y: auto;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { margin: 0; font-size: 17px; }
    .close-modal {
      background: #f1f5f9;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .setting-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 14px;
      font-weight: 700;
      color: var(--teal-dark);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .db-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .db-tab {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .db-tab.active {
      background: var(--teal-dark);
      color: #fff;
      border-color: var(--teal-dark);
    }
    .db-form {
      background: var(--teal-bg);
      border: 1px solid #99f6e4;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 10px;
    }
    .db-form input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
    }
    .json-preview {
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 11px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 10px 0;
      text-align: center;
    }
    .cal-day {
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      cursor: pointer;
    }
    .cal-day.has-chat {
      background: var(--teal-light);
      border-color: var(--teal-main);
      font-weight: 700;
      color: var(--teal-dark);
    }
    .cal-day.selected {
      background: var(--teal-dark);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header id="appHeader">
    <div class="brand">
      <div class="brand-icon">🧚‍♀️</div>
      <div>
        <div class="brand-title">🧚‍♀️ Talk Aurelia • Learn Karbi Language</div>
        <div class="brand-sub"><span class="dot-live"></span> Offline SOV + Bundled JSON DB</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="top-btn" onclick="openModal('settingsModal')">⚙️ Settings</button>
      <button class="top-btn" onclick="openModal('aboutModal')">ℹ️ About</button>
      <button class="top-btn exit-btn" onclick="handleExit()">Exit</button>
    </div>
  </header>

  <!-- Quick Try Bar -->
  <div class="try-bar" id="tryBar">
    <span class="try-label">TRY:</span>
    <button class="chip" onclick="sendQuick('Lets go for tea')">Lets go for tea</button>
    <button class="chip" onclick="sendQuick('Kardom')">Kardom</button>
    <button class="chip" onclick="sendQuick('I eat rice')">I eat rice (SOV)</button>
    <button class="chip" onclick="sendQuick('Where are you going?')">Where are you going?</button>
    <button class="chip" onclick="sendQuick('I am going to the market')">I am going to the market</button>
  </div>

  <!-- Main Chat Dashboard -->
  <main id="chatBox"></main>

  <!-- Bottom Input Bar -->
  <div class="input-bar">
    <button class="mic-btn" id="micBtn" onclick="startVoiceInput()" title="Speak">🎙️</button>
    <input type="text" id="userInput" placeholder="Ask in English, অসমীয়া, or Karbi..." onkeydown="if(event.key==='Enter') handleSend()" />
    <button class="send-btn" onclick="handleSend()">➤</button>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) closeModal('settingsModal')">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>⚙️ Settings</h3>
        <button class="close-modal" onclick="closeModal('settingsModal')">✕</button>
      </div>

      <div class="setting-row">
        <div>
          <div style="font-weight:700;font-size:14px;">Opening & Closing Voice</div>
          <div style="font-size:12px;color:var(--muted);">Speak "Kardom" on open & "Chorolo" on exit</div>
        </div>
        <input type="checkbox" id="voiceGreetingToggle" style="width:20px;height:20px;accent-color:var(--teal-dark);" onchange="toggleVoiceGreetings(this.checked)" />
      </div>

      <button class="setting-btn" onclick="closeModal('settingsModal'); openJsonDbModal();">
        <span>🗄️ JSON DB Manager (4 Bundled Datasets)</span>
        <span>›</span>
      </button>

      <button class="setting-btn" onclick="exportAllChatTxt()">
        <span>📄 Export Full Chat History (.txt)</span>
        <span>↓</span>
      </button>

      <button class="setting-btn" style="color:#dc2626;" onclick="clearChatHistory()">
        <span>🗑️ Clear Chat History</span>
        <span>!</span>
      </button>
    </div>
  </div>

  <!-- ABOUT MODAL -->
  <div class="modal-backdrop" id="aboutModal" onclick="if(event.target===this) closeModal('aboutModal')">
    <div class="modal-sheet">
      <div class
