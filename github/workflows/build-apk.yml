name: Build Talk Aurelia Learn Karbi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Web Assets to Android WWW
        run: |
          mkdir -p android/app/src/main/assets/www/data
          cp index.html android/app/src/main/assets/www/index.html
          cp -f *.json android/app/src/main/assets/www/data/ 2>/dev/null || true

      - name: Create Root Gradle Project Files
        run: |
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TalkAureliaLearnKarbi"
          include ':app'
          EOF

          cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug

      - name: Upload New App APK
        uses: actions/upload-artifact@v4
        with:
          name: Talk-Aurelia-Learn-Karbi-v1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
